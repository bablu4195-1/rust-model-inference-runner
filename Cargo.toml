[package]
name = "rust-inference-model-runner"
version = "0.1.0"
edition = "2021"
description = "A lightweight inference model runner in Rust using Candle"

[dependencies]
# Candle - Hugging Face's Rust ML framework (crates.io versions)
candle-core = "0.10.2"
candle-transformers = "0.10.2"
candle-nn = "0.10.2"
hf-hub = "0.4"
tokenizers = "0.21"

# CLI helpers
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File/IO
directories = "5"

# HTTP client for cloud APIs
reqwest = { version = "0.12", features = ["json", "blocking"] }